services:
  postgres:
    image: postgres:16-alpine3.23
    container_name: laboratorio1_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - laboratorio1_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: keycloak
    # start.sh ejecuta "kc.sh start-dev --import-realm":
    #   --import-realm: importa los realms en /opt/keycloak/data/import al arrancar
    entrypoint: ["/bin/bash", "/opt/keycloak/start.sh"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-laboratorio.json:/opt/keycloak/data/import/realm-laboratorio.json:ro
      - ./keycloak/start.sh:/opt/keycloak/start.sh:ro

volumes:
  laboratorio1_data: